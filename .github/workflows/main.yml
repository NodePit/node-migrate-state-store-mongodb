name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported version (engines.node) and every newer one
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # reads the version from packageManager in package.json
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # --no-runtime: use the Node.js version of the matrix, not devEngines.runtime
      - run: pnpm install --frozen-lockfile --no-runtime

      - run: pnpm exec node --version

      - run: pnpm run lint

      - run: pnpm test --coverage

      - run: pnpm run build

      - uses: codecov/codecov-action@v7
        if: matrix.node-version == 22
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
