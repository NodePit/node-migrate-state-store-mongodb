name: CI

on:
  push:
    branches: [master]
  pull_request:

# The repository default is write. The workflow only reads, so a compromised
# action can’t push with this token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported version (engines.node) and every newer one
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # Reads the version from packageManager in package.json. Third-party
      # actions are pinned to a commit, so a moved tag can’t change what runs;
      # Dependabot updates the pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      # --no-runtime: use the Node.js version of the matrix, not devEngines.runtime
      - run: pnpm install --frozen-lockfile --no-runtime

      - run: pnpm exec node --version

      - run: pnpm run lint

      - run: pnpm test --coverage

      - run: pnpm run build

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.node-version == 22
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
